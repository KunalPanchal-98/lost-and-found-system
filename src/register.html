<!DOCTYPE html>
<html lang="en" ng-app="campusFindApp"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | CampusFind</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/auth.css"><link rel="stylesheet" href="assets/css/responsive.css"><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><script defer src="assets/js/app.js"></script></head>
<body data-page="register" ng-controller="PageController"><nav class="topbar"><div class="container nav-wrap"><a href="index.html" class="brand">CampusFind</a><div class="nav-links"><a href="browse.html">Browse Items</a><a class="btn btn-secondary btn-small" href="login.html">Login</a></div></div></nav>
<section class="auth-page"><div class="auth-shell"><div class="auth-card register-card"><div class="auth-header"><h1>Create account</h1><p>Join the campus community and start reporting lost or found items.</p></div>
<div class="form-alert error" ng-if="message">{{message}}</div><form class="auth-form" ng-submit="submitAuth()"><div class="input-grid two-col"><div class="field-group"><label>Full Name</label><input ng-model="form.name" required autocomplete="name"></div><div class="field-group"><label>College Email</label><input type="email" ng-model="form.email" required autocomplete="email"></div><div class="field-group"><label>Student/Employee ID</label><input ng-model="form.student_id" required></div><div class="field-group"><label>Phone Number</label><input type="tel" ng-model="form.phone" required autocomplete="tel"></div><div class="field-group"><label>Password</label><input type="password" ng-model="form.password" minlength="8" required autocomplete="new-password"></div><div class="field-group"><label>Confirm Password</label><input type="password" ng-model="form.confirm_password" minlength="8" required autocomplete="new-password"></div></div><button type="submit" class="btn btn-primary btn-block" ng-disabled="busy">Create account</button></form>
<div class="auth-footer"><span>Already have an account?</span><a href="login.html">Login</a></div></div></div></section></body></html>
