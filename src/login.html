<!DOCTYPE html>
<html lang="en" ng-app="campusFindApp"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | CampusFind</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/auth.css"><link rel="stylesheet" href="assets/css/responsive.css"><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><script defer src="assets/js/app.js"></script></head>
<body data-page="login" ng-controller="PageController"><nav class="topbar"><div class="container nav-wrap"><a href="index.html" class="brand">CampusFind</a><div class="nav-links"><a href="browse.html">Browse Items</a><a class="btn btn-secondary btn-small" href="register.html">Register</a></div></div></nav>
<section class="auth-page"><div class="auth-shell narrow"><div class="auth-card"><div class="auth-header"><h1>Welcome back</h1><p>Sign in to view your reports, claims, and notifications.</p></div>
<div class="form-alert error" ng-if="message">{{message}}</div><form class="auth-form" ng-submit="submitAuth()"><div class="field-group"><label>Email</label><input type="email" ng-model="form.email" required autocomplete="email"></div><div class="field-group"><label>Password</label><input type="password" ng-model="form.password" required autocomplete="current-password"></div><button type="submit" class="btn btn-primary btn-block" ng-disabled="busy">{{busy ? 'Signing in…' : 'Login'}}</button></form>
<div class="auth-footer"><span>Need an account?</span><a href="register.html">Register</a></div></div></div></section></body></html>
