<!DOCTYPE html>
<html lang="en" ng-app="campusFindApp"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profile | CampusFind</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/dashboard.css"><link rel="stylesheet" href="assets/css/responsive.css"><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><script defer src="assets/js/app.js"></script></head>
<body data-page="profile" ng-controller="PageController"><nav class="topbar"><div class="container nav-wrap"><a href="index.html" class="brand">CampusFind</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="notifications.html">Notifications</a><a href="#" ng-click="$event.preventDefault(); logout()">Logout</a></div></div></nav>
<section class="page-section"><div class="container narrow-container"><div class="page-header narrow-header"><div><p class="eyebrow">User profile</p><h1>Manage profile</h1></div></div><div class="form-alert error" ng-if="message && messageType === 'error'">{{message}}</div><div class="form-alert success" ng-if="message && messageType === 'success'">{{message}}</div>
<form class="stack-form" ng-submit="saveProfile()"><div class="input-grid two-col"><div class="field-group"><label>Full Name</label><input ng-model="form.name" required></div><div class="field-group"><label>Email</label><input type="email" ng-model="form.email" disabled></div><div class="field-group"><label>Student/Employee ID</label><input ng-model="form.student_id" required></div><div class="field-group"><label>Phone Number</label><input type="tel" ng-model="form.phone" required></div></div><button type="submit" class="btn btn-primary">Save Profile</button></form></div></section></body></html>
