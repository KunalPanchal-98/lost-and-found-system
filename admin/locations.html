<!DOCTYPE html>
<html lang="en" ng-app="campusFindApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Locations | CampusFind</title>
    <meta name="description" content="Manage campus locations.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script defer src="../assets/js/app.js"></script>
</head>
<body data-page="admin-locations" data-base="../" ng-controller="PageController" ng-cloak>
    <nav class="topbar">
        <div class="container nav-wrap">
            <a href="../index.html" class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="16.2" y1="16.2" x2="21" y2="21"></line>
                    </svg>
                </span>
                <span>CampusFind Admin</span>
            </a>
            <button type="button" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="{{navOpen}}" ng-click="toggleNav()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links" ng-class="{ open: navOpen }" ng-click="navOpen = false">
                <a href="../index.html">Public site</a>
                <a ng-if="user" href="#" ng-click="$event.preventDefault(); logout()">Logout</a>
            </div>
        </div>
    </nav>

    <section class="dashboard-shell admin-shell">
        <div class="container dashboard-layout">
            <aside class="sidebar">
                <div class="sidebar-brand">Admin</div>
                <nav>
                    <a href="index.html">Dashboard</a>
                    <a href="users.html">Users</a>
                    <a href="items.html">Items</a>
                    <a href="claims.html">Claims</a>
                    <a href="categories.html">Categories</a>
                    <a class="active" href="locations.html">Locations</a>
                    <a href="reports.html">Reports</a>
                </nav>
            </aside>
            <main class="content-panel">
                <div class="page-header">
                    <div>
                        <p class="eyebrow">Campus locations</p>
                        <h1>Manage locations</h1>
                    </div>
                </div>
                <div class="form-alert" ng-if="message" ng-class="messageType">{{message}}</div>
                <div class="panel-card">
                    <form class="inline-form" ng-submit="$event.preventDefault(); adminAction('location-create')">
                        <input ng-model="form.name" placeholder="Location name" aria-label="Location name" required>
                        <input ng-model="form.description" placeholder="Description" aria-label="Location description">
                        <button type="submit" class="btn btn-primary">Add Location</button>
                    </form>
                </div>
                <div class="panel-card">
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="row in adminRows">
                                    <td><input ng-model="row.name" aria-label="Location name"></td>
                                    <td><input ng-model="row.description" aria-label="Location description"></td>
                                    <td>
                                        <button type="button" class="btn btn-small btn-secondary" ng-click="adminAction('location-update', row)">Save</button>
                                        <button type="button" class="btn btn-small btn-danger" ng-click="adminAction('location-delete', row)">Delete</button>
                                    </td>
                                </tr>
                                <tr ng-if="!adminRows.length">
                                    <td colspan="3">No locations.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </section>
</body>
</html>
