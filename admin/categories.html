<!DOCTYPE html>
<html lang="en" ng-app="campusFindApp"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Categories | CampusFind</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dashboard.css"><link rel="stylesheet" href="../assets/css/responsive.css"><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><script defer src="../assets/js/app.js"></script></head>
<body data-page="admin-categories" data-base="../" ng-controller="PageController"><nav class="topbar"><div class="container nav-wrap"><a href="../index.html" class="brand">CampusFind Admin</a><div class="nav-links"><a href="../index.html">Public site</a><a href="#" ng-click="$event.preventDefault(); logout()">Logout</a></div></div></nav><section class="dashboard-shell admin-shell"><div class="container dashboard-layout"><aside class="sidebar"><div class="sidebar-brand">Admin</div><nav><a href="index.html">Dashboard</a><a href="users.html">Users</a><a href="items.html">Items</a><a href="claims.html">Claims</a><a class="active" href="categories.html">Categories</a><a href="locations.html">Locations</a><a href="reports.html">Reports</a></nav></aside><main class="content-panel"><div class="page-header"><div><p class="eyebrow">Category setup</p><h1>Manage categories</h1></div></div><div class="form-alert" ng-if="message" ng-class="messageType">{{message}}</div><div class="panel-card"><form class="inline-form" ng-submit="$event.preventDefault(); adminAction('category-create')"><input ng-model="form.name" placeholder="Category name" required><input ng-model="form.description" placeholder="Description"><button type="submit" class="btn btn-primary">Add Category</button></form></div><div class="panel-card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Description</th><th>Action</th></tr></thead><tbody><tr ng-repeat="row in adminRows"><td><input ng-model="row.name" aria-label="Category name"></td><td><input ng-model="row.description" aria-label="Category description"></td><td><button class="btn btn-small btn-secondary" ng-click="adminAction('category-update', row)">Save</button> <button class="btn btn-small btn-danger" ng-click="adminAction('category-delete', row)">Delete</button></td></tr><tr ng-if="!adminRows.length"><td colspan="3">No categories.</td></tr></tbody></table></div></div></main></div></section></body></html>
