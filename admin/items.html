<!DOCTYPE html>
<html lang="en" ng-app="campusFindApp"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage Items | CampusFind</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dashboard.css"><link rel="stylesheet" href="../assets/css/responsive.css"><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><script defer src="../assets/js/app.js"></script></head>
<body data-page="admin-items" data-base="../" ng-controller="PageController"><nav class="topbar"><div class="container nav-wrap"><a href="../index.html" class="brand">CampusFind Admin</a><div class="nav-links"><a href="../index.html">Public site</a><a href="#" ng-click="$event.preventDefault(); logout()">Logout</a></div></div></nav><section class="dashboard-shell admin-shell"><div class="container dashboard-layout"><aside class="sidebar"><div class="sidebar-brand">Admin</div><nav><a href="index.html">Dashboard</a><a href="users.html">Users</a><a class="active" href="items.html">Items</a><a href="claims.html">Claims</a><a href="categories.html">Categories</a><a href="locations.html">Locations</a><a href="reports.html">Reports</a></nav></aside><main class="content-panel"><div class="page-header"><div><p class="eyebrow">Item management</p><h1>Lost &amp; Found entries</h1></div></div><div class="form-alert" ng-if="message" ng-class="messageType">{{message}}</div><div class="panel-card"><div class="table-wrap"><table><thead><tr><th>Report</th><th>Item</th><th>Type</th><th>Reporter</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr ng-repeat="row in adminRows"><td>{{row.report_id}}</td><td>{{row.name}}</td><td>{{row.type}}</td><td>{{row.user_name}}</td><td><select ng-model="row.nextStatus"><option>Reported</option><option>Under Review</option><option>Matched</option><option>Claim Pending</option><option>Verified</option><option>Returned</option><option>Closed</option><option>Rejected</option></select></td><td><button class="btn btn-small btn-secondary" ng-click="adminAction('item-status', row, row.nextStatus || row.status)">Save</button> <button class="btn btn-small btn-danger" ng-click="adminAction('item-delete', row)">Delete</button></td></tr><tr ng-if="!adminRows.length"><td colspan="6">No items found.</td></tr></tbody></table></div></div></main></div></section></body></html>
