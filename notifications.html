<!DOCTYPE html>
<html lang="en" ng-app="campusFindApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications | CampusFind</title>
    <meta name="description" content="View and manage your CampusFind notifications.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script defer src="assets/js/app.js"></script>
</head>
<body data-page="notifications" ng-controller="PageController" ng-cloak>
    <nav class="topbar">
        <div class="container nav-wrap">
            <a href="index.html" class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="16.2" y1="16.2" x2="21" y2="21"></line>
                    </svg>
                </span>
                <span>CampusFind</span>
            </a>
            <button type="button" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="{{navOpen}}" ng-click="toggleNav()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links" ng-class="{ open: navOpen }" ng-click="navOpen = false">
                <a href="dashboard.html">Dashboard</a>
                <a href="claims.html">Claims</a>
                <a ng-if="user" href="#" ng-click="$event.preventDefault(); logout()">Logout</a>
            </div>
        </div>
    </nav>

    <section class="page-section">
        <div class="container narrow-container">
            <div class="page-header narrow-header">
                <div>
                    <p class="eyebrow">Recent activity · {{unreadCount}} unread</p>
                    <h1>Notifications</h1>
                </div>
                <button type="button" ng-if="unreadCount" ng-click="markRead()" class="btn btn-secondary">Mark all as read</button>
            </div>
            <div class="form-alert error" ng-if="message && messageType === 'error'">{{message}}</div>
            <div class="notification-list-panel">
                <div class="notification-item" ng-class="{unread: !isRead(note)}" ng-repeat="note in notifications">
                    <div class="notification-badge">{{note.type}}</div>
                    <div>
                        <h3>{{note.title}}</h3>
                        <p>{{note.message}}</p>
                        <span>{{note.created_at | date:'d MMM yyyy, h:mm a'}}</span>
                        <button type="button" ng-if="!isRead(note)" class="text-link" ng-click="markRead(note.id)">Mark read</button>
                    </div>
                </div>
                <div class="empty-card" ng-if="!notifications.length">
                    <h3>No notifications yet.</h3>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
