<!DOCTYPE html>
<html lang="en" ng-app="campusFindApp"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Report Lost Item | CampusFind</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/dashboard.css"><link rel="stylesheet" href="assets/css/responsive.css"><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><script defer src="assets/js/app.js"></script></head>
<body data-page="report-lost" ng-controller="PageController"><nav class="topbar"><div class="container nav-wrap"><a href="index.html" class="brand">CampusFind</a><div class="nav-links"><a href="browse.html">Browse Items</a><a href="dashboard.html">Dashboard</a></div></div></nav>
<section class="page-section"><div class="container narrow-container"><div class="page-header narrow-header"><div><p class="eyebrow">Report a loss</p><h1>Report Lost Item</h1></div></div><div class="form-alert error" ng-if="message">{{message}}</div>
<form class="stack-form" enctype="multipart/form-data" ng-submit="submitReport($event.target)"><input type="hidden" name="type" value="lost"><div class="input-grid two-col">
<div class="field-group"><label>Item Name</label><input name="name" required maxlength="255"></div><div class="field-group"><label>Category</label><select name="category_id" required><option value="">Select category</option><option ng-repeat="category in categories" ng-value="category.id">{{category.name}}</option></select></div>
<div class="field-group full-width"><label>Description</label><textarea name="description" rows="4" required></textarea></div><div class="field-group"><label>Lost Date</label><input name="item_date" type="date" required></div><div class="field-group"><label>Approximate Time</label><input name="item_time" type="time"></div>
<div class="field-group"><label>Lost Location</label><select name="location_id" required><option value="">Select location</option><option ng-repeat="location in locations" ng-value="location.id">{{location.name}}</option></select></div><div class="field-group"><label>Colour</label><input name="color"></div><div class="field-group"><label>Brand</label><input name="brand"></div>
<div class="field-group full-width"><label>Unique Identifying Details</label><textarea name="identifying_details" rows="3"></textarea></div><div class="field-group full-width"><label>Item Image (JPG, PNG, WEBP; max 5 MB)</label><input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"></div></div><button type="submit" class="btn btn-primary" ng-disabled="busy">{{busy ? 'Submitting…' : 'Submit Lost Report'}}</button></form></div></section></body></html>
